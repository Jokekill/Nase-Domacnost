services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: domacnost
      POSTGRES_USER: domacnost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-domacnost_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domacnost -d domacnost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backup sidecar (docs/ARCHITECTURE.md §4, D-009): independent of the app
  # container's life, has access to the database and to the uploads.
  backup:
    image: postgres:16-bookworm
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: domacnost
      POSTGRES_USER: domacnost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-domacnost_dev}
      BACKUP_HOUR: ${BACKUP_HOUR:-03}
      # Retention 7 daily / 4 weekly / 12 monthly.
      KEEP_DAILY: 7
      KEEP_WEEKLY: 4
      KEEP_MONTHLY: 12
    volumes:
      - ./docker/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./docker/backup/loop.sh:/usr/local/bin/loop.sh:ro
      # Host paths, not named volumes: a home server's backups should be
      # visible and copyable without docker (restore is step 11.6).
      - ${UPLOADS_HOST_DIR:-./data/uploads}:/data/uploads:ro
      - ${BACKUPS_HOST_DIR:-./data/backups}:/data/backups
    entrypoint: ["bash", "/usr/local/bin/loop.sh"]

  # One-shot: brings the schema up to date, then exits. Runs before the app so
  # two containers can never migrate at the same time (§11.4).
  # `docker compose run --rm migrate` after every update.
  migrate:
    image: ${APP_IMAGE:-nase-domacnost:local}
    build: .
    restart: "no"
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://domacnost:${POSTGRES_PASSWORD:-domacnost_dev}@db:5432/domacnost
    command: ["node", "scripts/migrate.mjs"]

  app:
    image: ${APP_IMAGE:-nase-domacnost:local}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://domacnost:${POSTGRES_PASSWORD:-domacnost_dev}@db:5432/domacnost
      UPLOADS_DIR: /data/uploads
      # The app never dumps anything itself: it drops the manual-backup
      # trigger into this directory and reads its size for the Settings
      # screen (§4.2). Unset it falls back to ./data/backups inside the
      # container, where the trigger never reaches the sidecar.
      BACKUPS_DIR: /data/backups
      PUBLIC_SHARING_ENABLED: ${PUBLIC_SHARING_ENABLED:-false}
      # Rohlík is connected in Nastavení (D-030); these two stay as a
      # fallback for installations that already set them.
      ROHLIK_EMAIL: ${ROHLIK_EMAIL:-}
      ROHLIK_PASSWORD: ${ROHLIK_PASSWORD:-}
      # Encrypts stored third-party credentials. Left empty the app generates
      # a key into the app_secrets volume on first use.
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      # HTTPS comes from `tailscale serve` in front of this (D-003), so the
      # __Host- cookie prefix stays on.
      DEV_INSECURE_COOKIES: ${DEV_INSECURE_COOKIES:-false}
    ports:
      # Bound to localhost: the outside world reaches it through Tailscale.
      - "127.0.0.1:3000:3000"
    volumes:
      # Same host directory the backup sidecar reads (read-only) — see above.
      - ${UPLOADS_HOST_DIR:-./data/uploads}:/data/uploads
      # The sidecar's directory, shared: read for the total size shown in
      # Nastavení, written only to drop .trigger. The sidecar runs as root, the
      # app as uid 1001, so the host directory must belong to 1001 — see
      # docs/DEPLOY.md §6.
      - ${BACKUPS_HOST_DIR:-./data/backups}:/data/backups
      # Its own volume on purpose: the key must not end up in the nightly
      # archive together with the data it decrypts (D-030). The flip side is
      # that restoring a backup elsewhere does not carry the Rohlík password —
      # it gets typed again in Nastavení.
      - app_secrets:/data/secrets

volumes:
  db_data:
  app_secrets:
